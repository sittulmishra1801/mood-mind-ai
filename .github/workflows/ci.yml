name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and build frontend
        working-directory: ./
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend smoke test
        run: |
          python -c "import importlib; importlib.import_module('fastapi'); importlib.import_module('google')"
